<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>真实网页录制示例</title><style>
body{font:22px/1.6 system-ui,-apple-system,sans-serif;background:#f4f7fc;color:#17243a;margin:38px 70px}h1{font-size:36px;margin:16px 0}h2{font-size:29px;margin:0 0 18px}.badge{font-size:18px;color:#315de8}main{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:28px}section{background:white;border:1px solid #d5def0;border-radius:18px;padding:26px}button,select{font:inherit;padding:10px 20px;border-radius:9px;border:1px solid #b9c8e5;background:white}button{background:#315de8;color:white;cursor:pointer}label{display:block;margin:18px 0}select{margin-left:16px}#status{padding:20px;border-radius:12px;background:#edf2fc;margin-top:20px}.saved{background:#e4f6ec!important;color:#12643b}#settings[hidden]{display:none}
</style><div class="badge">本地可交互示例 · Playwright 实际操作与录制</div><h1>教程环境配置</h1><p>此网页仅用于验证录制流程，不会安装 Python 或修改系统环境。</p><main><section><h2>开始配置</h2><p>打开设置，选择版本，再保存结果。</p><button id="open-settings">打开设置</button><div id="status" role="status">尚未保存设置</div></section><section id="settings" hidden><h2>项目设置</h2><label for="version" style="display:inline">Python 版本</label><select id="version"><option value="3.12">3.12</option><option value="3.11">3.11</option></select><p id="selection">当前选择：3.12</p><button id="save-settings">保存设置</button></section></main><script>
const settings=document.querySelector('#settings'),version=document.querySelector('#version'),status=document.querySelector('#status');
document.querySelector('#open-settings').onclick=()=>{settings.hidden=false};
version.onchange=()=>{document.querySelector('#selection').textContent='当前选择：'+version.value};
document.querySelector('#save-settings').onclick=()=>{status.textContent='设置已保存：Python '+version.value;status.classList.add('saved')};
</script></html>
