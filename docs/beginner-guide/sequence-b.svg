<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2179" viewBox="0 0 1440 2179"><rect width="1440" height="2179" fill="#f6f8fc"/><g font-family="PingFang SC,sans-serif"><text x="55" y="77" font-size="42" fill="#17243a" text-anchor="start">时序图二｜整理素材与制作样片</text><text x="55" y="127" font-size="25" fill="#53657b" text-anchor="start">接续图一：Codex 统筹内容与工具，视频 Skill 负责重复的制作步骤。</text><rect x="23" y="169" width="254" height="94" rx="14" fill="#ffffff" stroke="#bfcce4" stroke-width="2"/><text x="150" y="211" font-size="32" fill="#17243a" text-anchor="middle">你</text><text x="150" y="246" font-size="22" fill="#53657b" text-anchor="middle">说目标、选效果</text><path d="M150 270 V2094" stroke="#bdc9db" stroke-width="2" stroke-dasharray="7 8"/><rect x="403" y="169" width="254" height="94" rx="14" fill="#ffffff" stroke="#bfcce4" stroke-width="2"/><text x="530" y="211" font-size="32" fill="#17243a" text-anchor="middle">Codex</text><text x="530" y="246" font-size="22" fill="#53657b" text-anchor="middle">查清楚、组织执行</text><path d="M530 270 V2094" stroke="#bdc9db" stroke-width="2" stroke-dasharray="7 8"/><rect x="783" y="169" width="254" height="94" rx="14" fill="#ffffff" stroke="#bfcce4" stroke-width="2"/><text x="910" y="211" font-size="32" fill="#17243a" text-anchor="middle">电脑／网页</text><text x="910" y="246" font-size="22" fill="#53657b" text-anchor="middle">资料、操作与证据</text><path d="M910 270 V2094" stroke="#bdc9db" stroke-width="2" stroke-dasharray="7 8"/><rect x="1163" y="169" width="254" height="94" rx="14" fill="#ffffff" stroke="#bfcce4" stroke-width="2"/><text x="1290" y="211" font-size="32" fill="#17243a" text-anchor="middle">视频 Skill</text><text x="1290" y="246" font-size="22" fill="#53657b" text-anchor="middle">配音、画面与检查</text><path d="M1290 270 V2094" stroke="#bdc9db" stroke-width="2" stroke-dasharray="7 8"/><rect x="40" y="300" width="1360" height="45" rx="8" fill="#e4ecfb"/><text x="62" y="330" font-size="27" fill="#244fbd" text-anchor="start">阶段 B：把经过核对的过程，组织成新手能看懂的教程</text><text x="910.0" y="382" font-size="28" fill="#17243a" text-anchor="middle">读取视频 Skill，检查配音和合成环境</text><path d="M530 412 H1290" stroke="#315de8" stroke-width="3"/><polygon points="1290,412 1275,404 1275,420" fill="#315de8"/><text x="910.0" y="478" font-size="28" fill="#17243a" text-anchor="middle">返回可用引擎、内置样音和素材情况</text><path d="M1290 508 H530" stroke="#16786f" stroke-width="3" stroke-dasharray="11 9"/><polygon points="530,508 545,500 545,516" fill="#16786f"/><text x="340.0" y="574" font-size="28" fill="#17243a" text-anchor="middle">未指定声音时，播放短音</text><text x="340.0" y="611" font-size="28" fill="#17243a" text-anchor="middle">频供试听</text><path d="M530 641 H150" stroke="#315de8" stroke-width="3"/><polygon points="150,641 165,633 165,649" fill="#315de8"/><text x="340.0" y="692" font-size="28" fill="#17243a" text-anchor="middle">选声音；也可直接指定或</text><text x="340.0" y="729" font-size="28" fill="#17243a" text-anchor="middle">沿用上次</text><path d="M150 759 H530" stroke="#16786f" stroke-width="3" stroke-dasharray="11 9"/><polygon points="530,759 515,751 515,767" fill="#16786f"/><rect x="45" y="786" width="1350" height="94" rx="9" fill="#fff4da"/><text x="65" y="822" font-size="25" fill="#735020" text-anchor="start">声线分支：在线预设需已同意发送旁白；本地中文／Heart 需相应模型。本人声音需授权录音、准确转录和运行中的</text><text x="65" y="857" font-size="25" fill="#735020" text-anchor="start">克隆引擎，真实模型效果仍待验证。内置试听不需先装模型。</text><text x="910.0" y="920" font-size="28" fill="#17243a" text-anchor="middle">准备讲稿、分镜、模板或流程图</text><path d="M530 950 H1290" stroke="#315de8" stroke-width="3"/><polygon points="1290,950 1275,942 1275,958" fill="#315de8"/><text x="910.0" y="1016" font-size="28" fill="#17243a" text-anchor="middle">准备单语／双语字幕，标注重点和指针目标</text><path d="M530 1046 H1290" stroke="#315de8" stroke-width="3"/><polygon points="1290,1046 1275,1038 1275,1054" fill="#315de8"/><rect x="45" y="1088" width="1350" height="94" rx="9" fill="#fff4da"/><text x="65" y="1124" font-size="25" fill="#735020" text-anchor="start">素材分支：复用文字、截图、录屏或已有音频。导入音频需准确字幕时间；声音设计可能跨句变音色，先检查多句试</text><text x="65" y="1159" font-size="25" fill="#735020" text-anchor="start">听。</text><text x="1100.0" y="1222" font-size="28" fill="#17243a" text-anchor="middle">需要网页素材时：先测配</text><text x="1100.0" y="1259" font-size="28" fill="#17243a" text-anchor="middle">音，再安排真实动作</text><path d="M1290 1289 H910" stroke="#315de8" stroke-width="3"/><polygon points="910,1289 925,1281 925,1297" fill="#315de8"/><text x="1100.0" y="1340" font-size="28" fill="#17243a" text-anchor="middle">返回连续画面、结果截图</text><text x="1100.0" y="1377" font-size="28" fill="#17243a" text-anchor="middle">与动作时间</text><path d="M910 1407 H1290" stroke="#16786f" stroke-width="3" stroke-dasharray="11 9"/><polygon points="1290,1407 1275,1399 1275,1415" fill="#16786f"/><rect x="45" y="1434" width="1350" height="94" rx="9" fill="#fff4da"/><text x="65" y="1470" font-size="25" fill="#735020" text-anchor="start">网页动作覆盖：点击、填写、按键、下拉选择、勾选／取消、悬停、滚动、跳转、等待结果文字。当前为独立浏览器</text><text x="65" y="1505" font-size="25" fill="#735020" text-anchor="start">单标签页；已有素材可直接复用。</text><text x="910.0" y="1568" font-size="28" fill="#17243a" text-anchor="middle">输出静态分镜，不生成新旁白</text><path d="M1290 1598 H530" stroke="#16786f" stroke-width="3" stroke-dasharray="11 9"/><polygon points="530,1598 545,1590 545,1606" fill="#16786f"/><text x="910.0" y="1664" font-size="28" fill="#17243a" text-anchor="middle">按需制作选定分镜的有声样片</text><path d="M530 1694 H1290" stroke="#315de8" stroke-width="3"/><polygon points="1290,1694 1275,1686 1275,1702" fill="#315de8"/><text x="910.0" y="1760" font-size="28" fill="#17243a" text-anchor="middle">返回带配音、字幕、编号与指针的样片</text><path d="M1290 1790 H530" stroke="#16786f" stroke-width="3" stroke-dasharray="11 9"/><polygon points="530,1790 545,1782 545,1798" fill="#16786f"/><text x="340.0" y="1856" font-size="28" fill="#17243a" text-anchor="middle">展示样片，让你检查风格</text><text x="340.0" y="1893" font-size="28" fill="#17243a" text-anchor="middle">与讲解</text><path d="M530 1923 H150" stroke="#315de8" stroke-width="3"/><polygon points="150,1923 165,1915 165,1931" fill="#315de8"/><text x="340.0" y="1974" font-size="28" fill="#17243a" text-anchor="middle">提出具体修改；已确认设</text><text x="340.0" y="2011" font-size="28" fill="#17243a" text-anchor="middle">置继续沿用</text><path d="M150 2041 H530" stroke="#16786f" stroke-width="3" stroke-dasharray="11 9"/><polygon points="530,2041 515,2033 515,2049" fill="#16786f"/><text x="55" y="2124" font-size="23" fill="#53657b" text-anchor="start">选择路径取决于素材和声线；不是每次都启动所有引擎，也不要求每个阶段重复确认。</text></g></svg>