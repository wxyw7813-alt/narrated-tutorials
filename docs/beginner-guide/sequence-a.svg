<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2014" viewBox="0 0 1440 2014"><rect width="1440" height="2014" fill="#f6f8fc"/><g font-family="PingFang SC,sans-serif"><text x="55" y="77" font-size="42" fill="#17243a" text-anchor="start">时序图一｜先弄清并完成任务</text><text x="55" y="127" font-size="25" fill="#53657b" text-anchor="start">从上往下看：实线是发出请求，虚线是返回结果；黄色框说明条件或分支。</text><rect x="23" y="169" width="254" height="94" rx="14" fill="#ffffff" stroke="#bfcce4" stroke-width="2"/><text x="150" y="211" font-size="32" fill="#17243a" text-anchor="middle">你</text><text x="150" y="246" font-size="22" fill="#53657b" text-anchor="middle">说目标、选效果</text><path d="M150 270 V1929" stroke="#bdc9db" stroke-width="2" stroke-dasharray="7 8"/><rect x="403" y="169" width="254" height="94" rx="14" fill="#ffffff" stroke="#bfcce4" stroke-width="2"/><text x="530" y="211" font-size="32" fill="#17243a" text-anchor="middle">Codex</text><text x="530" y="246" font-size="22" fill="#53657b" text-anchor="middle">查清楚、组织执行</text><path d="M530 270 V1929" stroke="#bdc9db" stroke-width="2" stroke-dasharray="7 8"/><rect x="783" y="169" width="254" height="94" rx="14" fill="#ffffff" stroke="#bfcce4" stroke-width="2"/><text x="910" y="211" font-size="32" fill="#17243a" text-anchor="middle">电脑／网页</text><text x="910" y="246" font-size="22" fill="#53657b" text-anchor="middle">资料、操作与证据</text><path d="M910 270 V1929" stroke="#bdc9db" stroke-width="2" stroke-dasharray="7 8"/><rect x="1163" y="169" width="254" height="94" rx="14" fill="#ffffff" stroke="#bfcce4" stroke-width="2"/><text x="1290" y="211" font-size="32" fill="#17243a" text-anchor="middle">视频 Skill</text><text x="1290" y="246" font-size="22" fill="#53657b" text-anchor="middle">配音、画面与检查</text><path d="M1290 270 V1929" stroke="#bdc9db" stroke-width="2" stroke-dasharray="7 8"/><rect x="40" y="300" width="1360" height="45" rx="8" fill="#e4ecfb"/><text x="62" y="330" font-size="27" fill="#244fbd" text-anchor="start">阶段 A：先把目标变成可执行、可验证的任务</text><text x="340.0" y="382" font-size="28" fill="#17243a" text-anchor="middle">我想达到什么结果；附上</text><text x="340.0" y="419" font-size="28" fill="#17243a" text-anchor="middle">已有材料</text><path d="M150 449 H530" stroke="#315de8" stroke-width="3"/><polygon points="530,449 515,441 515,457" fill="#315de8"/><text x="720.0" y="500" font-size="28" fill="#17243a" text-anchor="middle">检查已有文件、软件、环</text><text x="720.0" y="537" font-size="28" fill="#17243a" text-anchor="middle">境和可用工具</text><path d="M530 567 H910" stroke="#315de8" stroke-width="3"/><polygon points="910,567 895,559 895,575" fill="#315de8"/><text x="720.0" y="618" font-size="28" fill="#17243a" text-anchor="middle">返回现状、已有素材与缺</text><text x="720.0" y="655" font-size="28" fill="#17243a" text-anchor="middle">少的条件</text><path d="M910 685 H530" stroke="#16786f" stroke-width="3" stroke-dasharray="11 9"/><polygon points="530,685 545,677 545,693" fill="#16786f"/><text x="720.0" y="736" font-size="28" fill="#17243a" text-anchor="middle">查官方说明、读取你提供</text><text x="720.0" y="773" font-size="28" fill="#17243a" text-anchor="middle">的资料</text><path d="M530 803 H910" stroke="#315de8" stroke-width="3"/><polygon points="910,803 895,795 895,811" fill="#315de8"/><text x="720.0" y="854" font-size="28" fill="#17243a" text-anchor="middle">返回可靠步骤、来源与版</text><text x="720.0" y="891" font-size="28" fill="#17243a" text-anchor="middle">本信息</text><path d="M910 921 H530" stroke="#16786f" stroke-width="3" stroke-dasharray="11 9"/><polygon points="530,921 545,913 545,929" fill="#16786f"/><text x="340.0" y="972" font-size="28" fill="#17243a" text-anchor="middle">用白话解释用途，列步骤</text><text x="340.0" y="1009" font-size="28" fill="#17243a" text-anchor="middle">和成功标准</text><path d="M530 1039 H150" stroke="#315de8" stroke-width="3"/><polygon points="150,1039 165,1031 165,1047" fill="#315de8"/><rect x="45" y="1066" width="1350" height="59" rx="9" fill="#fff4da"/><text x="65" y="1102" font-size="25" fill="#735020" text-anchor="start">只在确实缺少关键信息时询问；登录、必要授权等环节由你参与。已明确的目标和偏好继续沿用。</text><text x="340.0" y="1165" font-size="28" fill="#17243a" text-anchor="middle">补充必要信息，或明确需</text><text x="340.0" y="1202" font-size="28" fill="#17243a" text-anchor="middle">要自己完成的环节</text><path d="M150 1232 H530" stroke="#16786f" stroke-width="3" stroke-dasharray="11 9"/><polygon points="530,1232 515,1224 515,1240" fill="#16786f"/><text x="720.0" y="1283" font-size="28" fill="#17243a" text-anchor="middle">需要实操时，运行命令、</text><text x="720.0" y="1320" font-size="28" fill="#17243a" text-anchor="middle">编辑文件或操作界面</text><path d="M530 1350 H910" stroke="#315de8" stroke-width="3"/><polygon points="910,1350 895,1342 895,1358" fill="#315de8"/><text x="720.0" y="1401" font-size="28" fill="#17243a" text-anchor="middle">返回实际结果、截图／录</text><text x="720.0" y="1438" font-size="28" fill="#17243a" text-anchor="middle">屏、错误信息</text><path d="M910 1468 H530" stroke="#16786f" stroke-width="3" stroke-dasharray="11 9"/><polygon points="530,1468 545,1460 545,1476" fill="#16786f"/><rect x="40" y="1499" width="1360" height="45" rx="8" fill="#e4ecfb"/><text x="62" y="1529" font-size="27" fill="#244fbd" text-anchor="start">遇到问题：定位原因 → 修复 → 重试相关步骤 → 再核对</text><text x="720.0" y="1581" font-size="28" fill="#17243a" text-anchor="middle">运行检查，确认目标真正</text><text x="720.0" y="1618" font-size="28" fill="#17243a" text-anchor="middle">达到</text><path d="M530 1648 H910" stroke="#315de8" stroke-width="3"/><polygon points="910,1648 895,1640 895,1656" fill="#315de8"/><text x="720.0" y="1699" font-size="28" fill="#17243a" text-anchor="middle">保存通过／未通过的证据</text><text x="720.0" y="1736" font-size="28" fill="#17243a" text-anchor="middle">与真实步骤</text><path d="M910 1766 H530" stroke="#16786f" stroke-width="3" stroke-dasharray="11 9"/><polygon points="530,1766 545,1758 545,1774" fill="#16786f"/><rect x="45" y="1793" width="1350" height="94" rx="9" fill="#fff4da"/><text x="65" y="1829" font-size="25" fill="#735020" text-anchor="start">实际操作依赖当前可用工具和权限。桌面录屏需要宿主工具；无法实机验证时，标明“待验证／示意”，保留可继续完</text><text x="65" y="1864" font-size="25" fill="#735020" text-anchor="start">成的部分。</text><text x="55" y="1959" font-size="23" fill="#53657b" text-anchor="start">范围：本图涵盖本 Skill 场景中的任务研究、操作与验证；不代表任意任务都能无人参与地完成。</text></g></svg>