<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2083" viewBox="0 0 1440 2083"><rect width="1440" height="2083" fill="#f6f8fc"/><g font-family="PingFang SC,sans-serif"><text x="55" y="77" font-size="42" fill="#17243a" text-anchor="start">时序图三｜检查、交付与修改</text><text x="55" y="127" font-size="25" fill="#53657b" text-anchor="start">接续图二：每次修改配音或片段后，重新核对受影响的时间与画面。</text><rect x="23" y="169" width="254" height="94" rx="14" fill="#ffffff" stroke="#bfcce4" stroke-width="2"/><text x="150" y="211" font-size="32" fill="#17243a" text-anchor="middle">你</text><text x="150" y="246" font-size="22" fill="#53657b" text-anchor="middle">说目标、选效果</text><path d="M150 270 V1998" stroke="#bdc9db" stroke-width="2" stroke-dasharray="7 8"/><rect x="403" y="169" width="254" height="94" rx="14" fill="#ffffff" stroke="#bfcce4" stroke-width="2"/><text x="530" y="211" font-size="32" fill="#17243a" text-anchor="middle">Codex</text><text x="530" y="246" font-size="22" fill="#53657b" text-anchor="middle">查清楚、组织执行</text><path d="M530 270 V1998" stroke="#bdc9db" stroke-width="2" stroke-dasharray="7 8"/><rect x="783" y="169" width="254" height="94" rx="14" fill="#ffffff" stroke="#bfcce4" stroke-width="2"/><text x="910" y="211" font-size="32" fill="#17243a" text-anchor="middle">电脑／网页</text><text x="910" y="246" font-size="22" fill="#53657b" text-anchor="middle">资料、操作与证据</text><path d="M910 270 V1998" stroke="#bdc9db" stroke-width="2" stroke-dasharray="7 8"/><rect x="1163" y="169" width="254" height="94" rx="14" fill="#ffffff" stroke="#bfcce4" stroke-width="2"/><text x="1290" y="211" font-size="32" fill="#17243a" text-anchor="middle">视频 Skill</text><text x="1290" y="246" font-size="22" fill="#53657b" text-anchor="middle">配音、画面与检查</text><path d="M1290 270 V1998" stroke="#bdc9db" stroke-width="2" stroke-dasharray="7 8"/><rect x="40" y="300" width="1360" height="45" rx="8" fill="#e4ecfb"/><text x="62" y="330" font-size="27" fill="#244fbd" text-anchor="start">阶段 C：合成 → 检查 → 交付 → 按意见再修改</text><text x="910.0" y="382" font-size="28" fill="#17243a" text-anchor="middle">生成／复用配音，测量每句实际起止</text><path d="M530 412 H1290" stroke="#315de8" stroke-width="3"/><polygon points="1290,412 1275,404 1275,420" fill="#315de8"/><text x="910.0" y="478" font-size="28" fill="#17243a" text-anchor="middle">按同一时间轴安排画面、单语／双语字幕和指针</text><path d="M530 508 H1290" stroke="#315de8" stroke-width="3"/><polygon points="1290,508 1275,500 1275,516" fill="#315de8"/><text x="910.0" y="574" font-size="28" fill="#17243a" text-anchor="middle">导出视频、字幕、章节与制作记录</text><path d="M1290 604 H530" stroke="#16786f" stroke-width="3" stroke-dasharray="11 9"/><polygon points="530,604 545,596 545,612" fill="#16786f"/><text x="910.0" y="670" font-size="28" fill="#17243a" text-anchor="middle">检查解码、时长、字幕范围、指针和重要区域</text><path d="M530 700 H1290" stroke="#315de8" stroke-width="3"/><polygon points="1290,700 1275,692 1275,708" fill="#315de8"/><text x="910.0" y="766" font-size="28" fill="#17243a" text-anchor="middle">输出关键帧、自动检查和待人工确认项</text><path d="M1290 796 H530" stroke="#16786f" stroke-width="3" stroke-dasharray="11 9"/><polygon points="530,796 545,788 545,804" fill="#16786f"/><rect x="40" y="842" width="1360" height="45" rx="8" fill="#e4ecfb"/><text x="62" y="872" font-size="27" fill="#244fbd" text-anchor="start">发现错误：修改对应分镜／素材 → 重新计时与合成 → 再检查</text><text x="340.0" y="924" font-size="28" fill="#17243a" text-anchor="middle">交付 MP4、字幕、验收页</text><text x="340.0" y="961" font-size="28" fill="#17243a" text-anchor="middle">和可修改配置</text><path d="M530 991 H150" stroke="#315de8" stroke-width="3"/><polygon points="150,991 165,983 165,999" fill="#315de8"/><text x="340.0" y="1042" font-size="28" fill="#17243a" text-anchor="middle">试听并看画面：读音、音</text><text x="340.0" y="1079" font-size="28" fill="#17243a" text-anchor="middle">色、指针、内容</text><path d="M150 1109 H530" stroke="#315de8" stroke-width="3"/><polygon points="530,1109 515,1101 515,1117" fill="#315de8"/><text x="340.0" y="1160" font-size="28" fill="#17243a" text-anchor="middle">按“第几步／几秒／怎么改</text><text x="340.0" y="1197" font-size="28" fill="#17243a" text-anchor="middle">”反馈；可附反馈文件</text><path d="M150 1227 H530" stroke="#315de8" stroke-width="3"/><polygon points="530,1227 515,1219 515,1235" fill="#315de8"/><text x="910.0" y="1278" font-size="28" fill="#17243a" text-anchor="middle">保留满意部分，重做受影响片段</text><path d="M530 1308 H1290" stroke="#315de8" stroke-width="3"/><polygon points="1290,1308 1275,1300 1275,1316" fill="#315de8"/><text x="910.0" y="1374" font-size="28" fill="#17243a" text-anchor="middle">返回新版成片和新的检查结果</text><path d="M1290 1404 H530" stroke="#16786f" stroke-width="3" stroke-dasharray="11 9"/><polygon points="530,1404 545,1396 545,1412" fill="#16786f"/><rect x="40" y="1450" width="1360" height="45" rx="8" fill="#e4ecfb"/><text x="62" y="1480" font-size="27" fill="#244fbd" text-anchor="start">可选：你已要求上传时，按指定目标和范围发布</text><text x="720.0" y="1532" font-size="28" fill="#17243a" text-anchor="middle">写入指定飞书文档，或更</text><text x="720.0" y="1569" font-size="28" fill="#17243a" text-anchor="middle">新指定 GitHub 仓库</text><path d="M530 1599 H910" stroke="#315de8" stroke-width="3"/><polygon points="910,1599 895,1591 895,1607" fill="#315de8"/><text x="720.0" y="1650" font-size="28" fill="#17243a" text-anchor="middle">返回保存状态与可访问链</text><text x="720.0" y="1687" font-size="28" fill="#17243a" text-anchor="middle">接</text><path d="M910 1717 H530" stroke="#16786f" stroke-width="3" stroke-dasharray="11 9"/><polygon points="530,1717 545,1709 545,1725" fill="#16786f"/><text x="340.0" y="1768" font-size="28" fill="#17243a" text-anchor="middle">说明完成情况、待确认项</text><text x="340.0" y="1805" font-size="28" fill="#17243a" text-anchor="middle">、文件及链接</text><path d="M530 1835 H150" stroke="#315de8" stroke-width="3"/><polygon points="150,1835 165,1827 165,1843" fill="#315de8"/><rect x="45" y="1862" width="1350" height="94" rx="9" fill="#fff4da"/><text x="65" y="1898" font-size="25" fill="#735020" text-anchor="start">需要写入飞书或发布 GitHub 时，按你指定的目标与范围执行；默认本地交付。自动检查通过，不代表人已认可声音</text><text x="65" y="1933" font-size="25" fill="#735020" text-anchor="start">和内容。</text><text x="55" y="2028" font-size="23" fill="#53657b" text-anchor="start">当前仍需人工判断读音、音色一致性与操作含义；参考声音固定方案尚未在承岳流程中完成。</text></g></svg>