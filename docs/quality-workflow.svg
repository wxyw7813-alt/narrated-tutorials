<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="850" viewBox="0 0 1560 850"><rect width="1560" height="850" fill="#f4f7fc"/><g font-family="PingFang SC,sans-serif" fill="#17243a"><text x="65" y="90" font-size="45">从想法到可复查的教程视频</text><text x="65" y="145" font-size="26" fill="#53657b">素材真实 · 先看样片 · 每次交付有检查记录</text><rect x="65" y="195" width="325" height="170" rx="20" fill="white" stroke="#315de8" stroke-width="3"/><text x="87" y="261" font-size="31">1  目标与声音</text><text x="87" y="317" font-size="20" fill="#53657b">新手看懂什么？先试听选声</text><rect x="615" y="195" width="325" height="170" rx="20" fill="white" stroke="#315de8" stroke-width="3"/><text x="637" y="261" font-size="31">2  素材采集</text><text x="637" y="317" font-size="20" fill="#53657b">截图／已有录屏／真实网页</text><rect x="1165" y="195" width="325" height="170" rx="20" fill="white" stroke="#315de8" stroke-width="3"/><text x="1187" y="261" font-size="31">3  分镜与模板</text><text x="1187" y="317" font-size="20" fill="#53657b">先看静态图，再看有声样片</text><rect x="1165" y="510" width="325" height="170" rx="20" fill="white" stroke="#315de8" stroke-width="3"/><text x="1187" y="576" font-size="31">4  合成与同步</text><text x="1187" y="632" font-size="20" fill="#53657b">实际配音驱动字幕与画面</text><rect x="615" y="510" width="325" height="170" rx="20" fill="white" stroke="#315de8" stroke-width="3"/><text x="637" y="576" font-size="31">5  成片验收</text><text x="637" y="632" font-size="20" fill="#53657b">实际抽帧＋自动检查＋人工听看</text><rect x="65" y="510" width="325" height="170" rx="20" fill="white" stroke="#315de8" stroke-width="3"/><text x="87" y="576" font-size="31">6  交付与修改</text><text x="87" y="632" font-size="20" fill="#53657b">MP4／双语字幕／可追溯记录</text><path d="M405 280 L595 280" stroke="#315de8" stroke-width="4"/><polygon points="595,280 579,271 579,289" fill="#315de8"/><path d="M955 280 L1145 280" stroke="#315de8" stroke-width="4"/><polygon points="1145,280 1129,271 1129,289" fill="#315de8"/><path d="M1327 385 L1327 490" stroke="#315de8" stroke-width="4"/><polygon points="1327,490 1318,474 1336,474" fill="#315de8"/><path d="M1145 595 L960 595" stroke="#315de8" stroke-width="4"/><polygon points="960,595 976,586 976,604" fill="#315de8"/><path d="M595 595 L410 595" stroke="#315de8" stroke-width="4"/><polygon points="410,595 426,586 426,604" fill="#315de8"/><text x="65" y="775" font-size="25" fill="#53657b">采集与渲染可以独立复用；发现问题后修改对应分镜，再生成样片复查。</text></g></svg>