<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1450" viewBox="0 0 1800 1450"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7282a0"/></marker></defs><rect width="1800" height="1450" fill="#f3f6fc"/><text x="900" y="65" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="46" fill="#17243a" text-anchor="middle" dominant-baseline="central">把“制作一次视频”变成“人人能复用的 Skill”</text><text x="900" y="117" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="28" fill="#53657b" text-anchor="middle" dominant-baseline="central">选声音 → 试听 → 合成 → 检查 → 交付</text><rect x="555" y="175" width="690" height="120" rx="23" fill="#ffffff" stroke="#cbd5e8" stroke-width="2"/><text x="900.0" y="211.5" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="34" fill="#17243a" text-anchor="middle" dominant-baseline="central">提供讲解内容与素材</text><text x="900.0" y="258.5" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">步骤、截图、已有录屏，中文或英文</text><polyline points="900,295 900,340 440,340 440,385" fill="none" stroke="#7282a0" stroke-width="3" marker-end="url(#arrow)"/><polyline points="900,295 900,340 1360,340 1360,385" fill="none" stroke="#7282a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="385" width="680" height="190" rx="23" fill="#eaf0ff" stroke="#b8c9fc" stroke-width="2"/><text x="440.0" y="433.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="34" fill="#17243a" text-anchor="middle" dominant-baseline="central">选预设声音</text><text x="440.0" y="480.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">中文男女声各 2 种，英文各 3 种</text><text x="440.0" y="527.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">共 10 种，包含 Heart 英文离线方案</text><rect x="1020" y="385" width="680" height="190" rx="23" fill="#e8f5ef" stroke="#b4ddca" stroke-width="2"/><text x="1360.0" y="433.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="34" fill="#17243a" text-anchor="middle" dominant-baseline="central">用自己的声音</text><text x="1360.0" y="480.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">本人或已获授权的录音 + 准确转录</text><text x="1360.0" y="527.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">通过本地 VoiceStudio 生成新旁白</text><polyline points="440,575 440,625 900,625 900,670" fill="none" stroke="#7282a0" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1360,575 1360,625 900,625" fill="none" stroke="#7282a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="555" y="670" width="690" height="130" rx="23" fill="#ffffff" stroke="#cbd5e8" stroke-width="2"/><text x="900.0" y="711.5" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="34" fill="#17243a" text-anchor="middle" dominant-baseline="central">先试听一小段，再定声线</text><text x="900.0" y="758.5" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">不喜欢就调语速、音高，或换一个声音</text><polyline points="900,800 900,850" fill="none" stroke="#7282a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="555" y="850" width="690" height="135" rx="23" fill="#ffffff" stroke="#cbd5e8" stroke-width="2"/><text x="900.0" y="894.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="34" fill="#17243a" text-anchor="middle" dominant-baseline="central">生成旁白、画面与字幕</text><text x="900.0" y="941.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">按音轨重算画面时长；给截图加点击编号</text><polyline points="900,985 900,1035" fill="none" stroke="#7282a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="555" y="1035" width="690" height="120" rx="23" fill="#ffffff" stroke="#cbd5e8" stroke-width="2"/><text x="900.0" y="1071.5" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="34" fill="#17243a" text-anchor="middle" dominant-baseline="central">检查成片</text><text x="900.0" y="1118.5" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">听漏字和术语，看字幕、标注与步骤是否清楚</text><polyline points="900,1155 900,1205" fill="none" stroke="#7282a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="555" y="1205" width="690" height="125" rx="23" fill="#eaf0ff" stroke="#b8c9fc" stroke-width="2"/><text x="900.0" y="1244.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="34" fill="#17243a" text-anchor="middle" dominant-baseline="central">交付视频、字幕和制作记录</text><text x="900.0" y="1291.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">Skill 单独分享，个人录音留在使用者电脑</text><text x="900" y="1388" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="26" fill="#53657b" text-anchor="middle" dominant-baseline="central">Skill 安排流程 · 声音引擎负责说话 · FFmpeg 把声音与画面组合起来</text></svg>