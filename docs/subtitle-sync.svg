<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="510" viewBox="0 0 1800 510"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7282a0"/></marker></defs><rect width="1800" height="1450" fill="#f3f6fc"/><text x="900" y="55" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="43" fill="#17243a" text-anchor="middle" dominant-baseline="central">字幕跟着实际声音走，双语共用同一条时间轴</text><rect x="30" y="160" width="300" height="190" rx="23" fill="#eaf0ff" stroke="#b8c9fc" stroke-width="2"/><text x="180.0" y="208.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="34" fill="#17243a" text-anchor="middle" dominant-baseline="central">配对字幕</text><text x="180.0" y="255.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">原文 + 对应译文</text><text x="180.0" y="302.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">译文不单独估时</text><polyline points="330,255 382,255" fill="none" stroke="#7282a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="390" y="160" width="300" height="190" rx="23" fill="#e8f5ef" stroke="#b4ddca" stroke-width="2"/><text x="540.0" y="208.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="34" fill="#17243a" text-anchor="middle" dominant-baseline="central">生成每句配音</text><text x="540.0" y="255.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">按完整语句朗读</text><text x="540.0" y="302.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">保持自然句子</text><polyline points="690,255 742,255" fill="none" stroke="#7282a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="750" y="160" width="300" height="190" rx="23" fill="#eaf0ff" stroke="#b8c9fc" stroke-width="2"/><text x="900.0" y="208.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="34" fill="#17243a" text-anchor="middle" dominant-baseline="central">测量实际声音</text><text x="900.0" y="255.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">定位每句起止</text><text x="900.0" y="302.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">按采样数计时</text><polyline points="1050,255 1102,255" fill="none" stroke="#7282a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="1110" y="160" width="300" height="190" rx="23" fill="#e8f5ef" stroke="#b4ddca" stroke-width="2"/><text x="1260.0" y="208.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="34" fill="#17243a" text-anchor="middle" dominant-baseline="central">统一时间轴</text><text x="1260.0" y="255.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">画面、字幕、指针</text><text x="1260.0" y="302.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">换声线一起重算</text><polyline points="1410,255 1462,255" fill="none" stroke="#7282a0" stroke-width="3" marker-end="url(#arrow)"/><rect x="1470" y="160" width="300" height="190" rx="23" fill="#eaf0ff" stroke="#b8c9fc" stroke-width="2"/><text x="1620.0" y="208.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="34" fill="#17243a" text-anchor="middle" dominant-baseline="central">导出成片</text><text x="1620.0" y="255.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">单语 / 双语字幕</text><text x="1620.0" y="302.0" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="27" fill="#17243a" text-anchor="middle" dominant-baseline="central">MP4 + SRT / VTT</text><text x="900" y="440" font-family="PingFang SC,Noto Sans CJK SC,sans-serif" font-size="29" fill="#53657b" text-anchor="middle" dominant-baseline="central">每句字幕对应自己的音轨；换声线后重新测时长，不沿用旧时间。</text></svg>